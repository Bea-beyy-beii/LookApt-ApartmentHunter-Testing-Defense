{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LookApt — Sign Up</title>

    <!-- Base CSS -->
    <link rel="stylesheet" href="{% static 'core/css/base/reset.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/base/colors.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/base/typography.css' %}">

    <!-- Component CSS -->
    <link rel="stylesheet" href="{% static 'core/css/components/branding.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/components/buttons.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/components/forms.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/components/links.css' %}">

    <!-- Page CSS -->
    <link rel="stylesheet" href="{% static 'core/css/pages/login.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/pages/signup.css' %}">

</head>

<script>
document.querySelector('.login-form').addEventListener('submit', function (e) {
    var p = document.getElementById('password').value;
    var c = document.getElementById('confirm_password').value;
    if (p !== c) {
        e.preventDefault();
        var box = document.getElementById('client-error');
        if (!box) {
            box = document.createElement('p');
            box.id = 'client-error';
            box.className = 'login-error';
            document.querySelector('.login-form').prepend(box);
        }
        box.textContent = 'Passwords do not match.';
    }
});
</script>

<body
    class="signup-page"
    style="--login-background: url({% static 'core/images/noon.png' %});"
>

    <main class="login-card">

        <!-- Branding -->
        <header class="branding">

            <a href="#" class="brand">

                <img
                    src="{% static 'core/images/logo2.png' %}"
                    alt="LookApt"
                    class="brand-logo"
                >

                <h2 class="brand-name">
                    Look<span>Apt</span>
                </h2>

            </a>

            <p class="brand-tagline">
                Your next home, <span>in a tap.</span>
            </p>

        </header>


        <!-- Sign Up Content -->
        <section class="signup-content">

            <h1 class="signup-title">
                Create your LookApt account
            </h1>

            <p class="signup-subtitle">
                A step closer towards finding your next home...
            </p>


            <!-- Sign Up Form -->
            <form
                method="POST"
                action=""
                class="login-form"
            >

                {% csrf_token %}

                {% for message in messages %}
                    <p class="login-error">{{ message }}</p>
                {% endfor %}


                <!-- First Name -->
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <img src="{% static 'core/images/icons/person.png' %}" alt="" class="input-icons">
                        </span>
                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            placeholder="First Name"
                            autocomplete="given-name"
                            value="{{ form_data.first_name }}"
                            required
                        >
                    </div>
                </div>


                <!-- Last Name -->
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <img src="{% static 'core/images/icons/person.png' %}" alt="" class="input-icons">
                        </span>
                        <input
                            type="text"
                            id="last_name"
                            name="last_name"
                            placeholder="Last Name"
                            autocomplete="family-name"
                            value="{{ form_data.last_name }}"
                            required
                        >
                    </div>
                </div>


                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phone_number">Phone Number</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <img src="{% static 'core/images/icons/phone.png' %}" alt="" class="input-icons">
                        </span>
                        <input
                            type="tel"
                            id="phone_number"
                            name="phone_number"
                            placeholder="09XXXXXXXXX"
                            maxlength="11"
                            autocomplete="tel"
                            value="{{ form_data.phone_number }}"
                            required
                        >
                    </div>
                </div>


                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <img src="{% static 'core/images/icons/inbox.png' %}" alt="" class="input-icons">
                        </span>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Email"
                            autocomplete="email"
                            value="{{ form_data.email }}"
                            required
                        >
                    </div>
                </div>


                <!-- Sex -->
                <div class="form-group">
                    <label for="sex">Sex</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <img src="{% static 'core/images/icons/gender.png' %}" alt="" class="input-icons">
                        </span>
                        <select id="sex" name="sex" required>
                            <option value="" disabled {% if not form_data.sex %}selected{% endif %}>Select Sex</option>
                            <option value="female" {% if form_data.sex == 'female' %}selected{% endif %}>Female</option>
                            <option value="male" {% if form_data.sex == 'male' %}selected{% endif %}>Male</option>
                        </select>
                    </div>
                </div>


                <!-- Role -->
                <div class="form-group">
                    <label for="role">Role</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <img src="{% static 'core/images/icons/tag.png' %}" alt="" class="input-icons">
                        </span>
                        <select id="role" name="role" required>
                            <option value="" disabled {% if not form_data.role %}selected{% endif %}>Select Role</option>
                            <option value="renter" {% if form_data.role == 'renter' %}selected{% endif %}>Renter</option>
                            <option value="landlord" {% if form_data.role == 'landlord' %}selected{% endif %}>Landlord</option>
                        </select>
                    </div>
                </div>


                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <img src="{% static 'core/images/icons/lock.png' %}" alt="" class="input-icons">
                        </span>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="password-toggle" aria-label="Show password">
                            👁
                        </button>
                    </div>
                </div>


                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <img src="{% static 'core/images/icons/lock.png' %}" alt="" class="input-icons">
                        </span>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm Password"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="password-toggle" aria-label="Show password">
                            👁
                        </button>
                    </div>
                </div>


                <!-- Sign Up Button -->
                <button type="submit" class="btn btn-primary login-button">
                    SIGN UP
                </button>

            </form>


            <!-- Log In -->
            <p class="signup-text">
                Already have an account?
                <a href="{% url 'login' %}">Log in</a>
            </p>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="{% static 'core/js/password-toggle.js' %}"></script>

</body>

</html>
