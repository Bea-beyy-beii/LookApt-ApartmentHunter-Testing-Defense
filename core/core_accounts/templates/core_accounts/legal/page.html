{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LookApt — {{ page_title }}</title>

    <link rel="stylesheet" href="{% static 'core/css/base/reset.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/base/colors.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/base/typography.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/components/branding.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/components/links.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/components/legal.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/pages/legal.css' %}">
</head>
<body class="legal-page">
    <header class="legal-header">
        <a href="{% url 'login' %}" class="brand">
            <img src="{% static 'core/images/logo2.png' %}" alt="LookApt" class="brand-logo">
            <span class="brand-name">Look<span>Apt</span></span>
        </a>
        <nav class="legal-nav" aria-label="Legal">
            <a href="{% url 'terms' %}" {% if page == 'terms' %}aria-current="page"{% endif %}>Terms</a>
            <a href="{% url 'privacy' %}" {% if page == 'privacy' %}aria-current="page"{% endif %}>Privacy</a>
        </nav>
    </header>

    <main class="legal-card">
        {% if page == 'terms' %}
            {% include "core_accounts/legal/terms_body.html" %}
        {% else %}
            {% include "core_accounts/legal/privacy_body.html" %}
        {% endif %}
    </main>
</body>
</html>
