{% comment %}
    "Leave a Review" / your stars + "Edit" beside a complex name in Rental History.
    Needs t (a tenancy from core_rentals.services.get_renter_rentals_context).
    Opens core_reviews/review_modal.html (reviews.js).
{% endcomment %}
{% load review_tags %}
<button type="button" class="rv-open{% if t.my_review %} rv-open--done{% endif %}"
        data-open-review
        data-url="{% url 'core_reviews:save_review' t.pk %}"
        data-complex="{{ t.unit.complex.complex_name }}"
        data-address="{{ t.unit.complex.address }}"
        data-unit="{{ t.unit.unit_name }}"
        data-cover="{{ t.cover_url|default:'' }}"
        data-review="{{ t.review_data }}">
    {% if t.my_review %}
        {% star_rating t.my_review.complex_rating %}
        <span>Edit Review</span>
    {% else %}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>
        <span>Leave a Review</span>
    {% endif %}
</button>
